name: Build and deploy agent (claudecodeui)

on:
  push:
    branches: [main]
    paths:
      - "apps/agent/image/**"
  workflow_dispatch: {} # manual rebuild (e.g. to pull a newer upstream claudecodeui)

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/agent/image
          push: true
          tags: |
            ghcr.io/leayeh/claudecodeui:sha-${{ github.sha }}
            ghcr.io/leayeh/claudecodeui:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|ghcr.io/leayeh/claudecodeui:sha-.*|ghcr.io/leayeh/claudecodeui:sha-${{ github.sha }}|" \
            apps/agent/deployment.yaml

      - name: Commit and push updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/agent/deployment.yaml
          git commit -m "chore(agent): bump image to sha-$(echo ${{ github.sha }} | cut -c1-7)"
          git push
