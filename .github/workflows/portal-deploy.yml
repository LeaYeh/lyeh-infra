name: Build and deploy portal

on:
  push:
    branches: [main]
    paths:
      - "apps/portal/src/**"

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules for Blowfish theme)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Build Hugo site
        run: hugo --minify
        working-directory: apps/portal/src

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/portal/src
          push: true
          tags: |
            ghcr.io/leayeh/portal:sha-${{ github.sha }}
            ghcr.io/leayeh/portal:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|ghcr.io/leayeh/portal:sha-.*|ghcr.io/leayeh/portal:sha-${{ github.sha }}|" \
            apps/portal/deployment.yaml

      - name: Commit and push updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/portal/deployment.yaml
          git commit -m "chore(portal): bump image to sha-$(echo ${{ github.sha }} | cut -c1-7)"
          git push
